:root{--ink:#f6f8f8;--mute:#d2dde2;--glass:rgba(24,44,60,.48);--edge:rgba(214,232,240,.32);--on:#cfe6f2;--onink:#163a52;--pix:"KoPubWorld Dotum","KoPubWorldDotum","KoPub돋움체 Medium","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#8a8f88;color:var(--ink);font-family:var(--pix);overflow:hidden;touch-action:none}
#bg{position:fixed;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(22px) brightness(.78) saturate(1.05);image-rendering:auto}
.vig{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(20,26,30,.38) 100%);pointer-events:none}
#scene{position:fixed;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:pointer;box-shadow:0 0 60px rgba(20,30,36,.35)}
.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:1px;background:var(--glass);border:1px solid var(--edge);padding:5px 10px 6px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);max-width:min(250px,44%)}
.brand h1{margin:0;font-size:20px;font-weight:400;letter-spacing:.08em;line-height:1.2}
.brand p{margin:0;font-size:11px;opacity:.85;letter-spacing:.02em}
.brand nav{display:flex;gap:3px 9px;margin-top:3px;flex-wrap:wrap}
.brand a{font-size:11px;color:var(--ink);opacity:.72;text-decoration:none}
.brand a:hover,.brand a:focus-visible{opacity:1;text-decoration:underline}
.panel{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 64px);padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;pointer-events:none}
.glass{pointer-events:auto;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--edge);padding:9px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;max-width:1080px}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lbl{font-family:"Silkscreen",monospace;font-size:10px;color:var(--mute);letter-spacing:.12em;margin-right:2px}
.seg{display:flex;border:1px solid var(--edge)}
button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:0;padding:6px 9px;cursor:pointer;line-height:1.2}
.seg button+button{border-left:1px solid var(--edge)}
button[aria-pressed="true"]{background:var(--on);color:var(--onink)}
button:focus-visible{outline:2px solid #eaf8ff;outline-offset:1px}
#snd,#bloom{border:1px solid var(--edge)}
.hint{font-size:11px;color:var(--mute)}
.hide{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px));font-size:12px;background:var(--glass);border:1px solid var(--edge)}
.panel,.brand{transition:opacity .6s}
body.zen .panel,body.zen .brand{opacity:0;pointer-events:none}
body.zen .panel *{pointer-events:none}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--edge);padding:8px 14px;font-size:14px;opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.brand details{display:block;font-size:11px;margin-top:2px}.brand summary{cursor:pointer;opacity:.8;list-style:none}.brand summary::-webkit-details-marker{display:none}.brand details[open] nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
@media (max-width:640px){.glass{gap:6px;padding:7px;max-width:100%}.glass>*{flex:none}.lbl{display:none}button{font-size:12px;padding:6px 7px}.brand{max-width:64%;padding:4px 8px 5px}.brand p{white-space:nowrap}.brand h1{font-size:17px}.brand p{font-size:10px}.hint{display:none}}
@media (min-width:900px) and (min-aspect-ratio:1/1){.panel{left:auto;right:max(20px,env(safe-area-inset-right,0px));justify-content:flex-end}.glass{flex-direction:column;align-items:stretch;gap:10px;width:200px;padding:12px}.grp{flex-direction:column;align-items:flex-start;gap:4px}.hint{max-width:176px;line-height:1.45}}
@media (prefers-reduced-motion:reduce){.panel,.brand,.toast{transition:none}}

    if (p.dl > 0) { p.dl -= dt; mixXY(p.x, p.y, night() ? 150 : 176, night() ? 172 : 196, night() ? 200 : 216, .45 + (p.sill ? .3 : 0)); continue; }
    if (p.sill && !p.snd) { p.snd = 1; if (audio && R() < .4) tick2(); }
    p.vy += dt * 260; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y >= p.land) { const x = Math.round(p.x), y = Math.round(p.land); if (x >= 0 && x < W && y < H) { if (wet > .25) ripple(x, y, .5); else splashes.push({ x, y, t: 0 }); } falls.splice(k, 1); continue; }
    const x = Math.round(p.x), y = Math.round(p.y); if (x < 0 || x >= W || y < 0 || y >= H) continue; const L = LUM[y * W + x];
    const c = night() ? [170, 190, 214] : L > 160 ? [104, 126, 150] : [236, 246, 252];
    for (let q = 0; q < 2; q++) mixXY(x, y - q, c[0], c[1], c[2], .85 - q * .3); } }
/* 꽃잎: 흔들흔들 떨어져 바닥에 쌓이고, 물결에 밀림 */
function petalFx(dt) {
  if (gust > .5 && R() < dt * 4) { const b = buds[R() * buds.length | 0]; petal(R() * W, 20 + R() * 110, false); }
  const c = night() ? [140, 150, 172] : [255, 252, 246];
  for (let k = petals.length - 1; k >= 0; k--) { const p = petals[k]; p.t += dt;
    if (p.rest > 0) { p.rest -= dt; if (p.rest <= 0) { petals.splice(k, 1); continue; }
      for (const rp of rips) { const dd = Math.hypot(p.x - rp.x, (p.y - rp.y) * 2.6); if (dd > 0 && dd < rp.t * 13 * rp.s + 2) p.x += (p.x - rp.x) / dd * dt * 7; } }
    else { p.vy = Math.min(24, p.vy + dt * 28); p.x += (p.vx + Math.sin(p.t * 3 + p.ph) * 13 + gust * 18) * dt; p.y += p.vy * dt; p.vx *= 1 - dt * .8; if (p.y >= p.land) { p.y = p.land; p.rest = 10 + R() * 8; } }
    const x = Math.round(p.x), y = Math.round(p.y); if (x < -6 || x > W + 6) { petals.splice(k, 1); continue; }
    const a = p.rest > 0 ? Math.min(1, p.rest / 2) * .9 : .95; mixXY(x, y, c[0], c[1], c[2], a); if (Math.sin(p.t * 5 + p.ph) > 0 || p.rest > 0) mixXY(x + 1, y, c[0], c[1], c[2], a * .6); } }
function splashFx(dt) {
  if (rain >= 2 && R() < dt * (rain === 3 ? 14 : 6)) splashes.push({ x: R() * W | 0, y: FLOOR + 1 + R() * (H - FLOOR - 2) | 0, t: 0 });
  const c = night() ? [150, 170, 192] : [238, 246, 252];
  for (let k = splashes.length - 1; k >= 0; k--) { const p = splashes[k]; p.t += dt; if (p.t > .2) { splashes.splice(k, 1); continue; } if (p.t < 0) continue;
    const a = (1 - p.t / .2) * .55, s = Math.round(p.t * 8); mixXY(p.x - 1 - s, p.y - 1, ...c, a * .7); mixXY(p.x + 1 + s, p.y - 1, ...c, a * .7); mixXY(p.x, p.y - 1 - s, ...c, a * .6); } }

/* ---------- 꽃 피우기 25분: 가지 끝 봉오리 열 개가 하나씩 핌 ---------- */
const BLOOM_MS = 25 * 60 * 1000; let bloomT0 = 0, bloomDone = false;
try { const v = +localStorage.getItem('kkotgeuneul-bloom'); if (v && Date.now() - v < BLOOM_MS) bloomT0 = v; } catch (e) {}
const bloomBtn = document.getElementById('bloom');
function bloomLeft() { const ms = Math.max(0, BLOOM_MS - (Date.now() - bloomT0)); return Math.floor(ms / 60000) + ':' + String(Math.floor(ms / 1000) % 60).padStart(2, '0'); }
function bloomUI() { const on = bloomT0 > 0; bloomBtn.setAttribute('aria-pressed', on); bloomBtn.textContent = on ? '✿ ' + bloomLeft() + ' · 그만' : '✿ 꽃 피우기 25분'; }
bloomBtn.addEventListener('click', () => { startAudio(false);
  if (bloomT0) { bloomT0 = 0; try { localStorage.removeItem('kkotgeuneul-bloom'); } catch (e) {} toast('꽃 피우기를 멈췄어요'); }
  else { bloomT0 = Date.now(); bloomDone = false; try { localStorage.setItem('kkotgeuneul-bloom', bloomT0); } catch (e) {} toast('봉오리 열 개가 25분 동안 하나씩 피어나요', 2600); }
  bloomUI(); });
setInterval(() => { if (bloomT0) { bloomUI(); if (Date.now() - bloomT0 >= BLOOM_MS && !bloomDone) { bloomDone = true; gust = 1.6; for (let k = 0; k < 40; k++) setTimeout(() => petal(R() * W, 10 + R() * 120, true), k * 60); toast('✿ 25분 끝! 꽃이 다 피었어요', 3600); if (audio) chime(); setTimeout(() => { bloomT0 = 0; try { localStorage.removeItem('kkotgeuneul-bloom'); } catch (e) {} bloomUI(); }, 12000); } } }, 1000);
function budFx() { if (!bloomT0) return; const p = (Date.now() - bloomT0) / BLOOM_MS, dn = night();
  for (const b of buds) { const target = p >= (b.k + 1) / 10 ? 1 : 0; b.open = target ? Math.min(1, b.open + .006) : 0;
    const d = sway(b.x, b.y) * LEAF[Math.max(0, b.y - 1) * W + b.x], x = b.x - Math.round(d), y = b.y; const m = dn ? .35 : 1;
    if (b.open < .5) { mixXY(x, y, 120 * m, 168 * m, 86 * m, 1); mixXY(x, y + 1, 236 * m, 240 * m, 226 * m, 1); mixXY(x, y + 2, 248 * m, 248 * m, 240 * m, .9 * (b.open * 2)); }
    else { const s = b.open; const W8 = [255 * m, 254 * m, 248 * m];
      for (const [dx, dy] of [[0, -1], [-1, 0], [1, 0], [-1, 1], [1, 1], [0, 2]]) mixXY(x + dx, y + 1 + dy, ...W8, s);
      if (s > .8) for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2]]) mixXY(x + dx, y + 1 + dy, ...W8, (s - .8) * 3);
      mixXY(x, y + 1, 246 * m, 200 * m, 70 * m, 1); } } }

/* ---------- 한 프레임 ---------- */
let last = performance.now(), acc = 0, bgT = 0;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; acc += dt;
  if (!document.hidden && (!reduce || acc > .12)) { step(reduce ? acc : dt); acc = 0; }
  requestAnimationFrame(loop);
}
function step(dt) {
  t += dt;
  const k = Math.min(1, dt * 1.2), T = TP[time];
  for (const key of ['m', 'a', 'sh']) for (let c = 0; c < 3; c++) tp[key][c] = lerp(tp[key][c], T[key][c], k);
  tp.warm = lerp(tp.warm, T.warm, k);
  // 해: 맑으면 1 (가끔 구름이 지나며 옅어짐), 이슬비 .25, 비 0. 밤엔 달빛이라 약하게
  cloudT += dt; const dip = rain === 0 ? Math.max(0, Math.sin(cloudT * .17) * 1.7 - 1.15) * .75 : 0;
  const st = (rain === 0 ? 1 - dip : rain === 1 ? .25 : 0) * (time === 2 ? .62 : time === 1 ? .85 : 1);   // 밤엔 달빛 (맑으면 옅고 푸른 꽃 그림자)
  sun += (st - sun) * dt * (st > sun ? .45 : 1.3);
  wet += ([0, .4, 1, 1][rain] - wet) * dt * (rain ? .25 : .05);
  for (const p of PUDS) p.l = rain ? Math.min(1, p.l + dt * rain * .03) : Math.max(0, p.l - dt * (.0035 + .006 * Math.min(1, sun)));   // 맑으면 약 2~3분에 마름
  gust = Math.max(0, gust - dt * .55); if (rain === 0 && R() < dt * .045) gust = 1;
  // 덧창: 바라는 쪽으로 천천히 (부드럽게 시작 · 끝)
  openV += clamp(openT - openV, -dt * .6, dt * .6);   // 약 1.7초, 그리기는 부드러운 곡선(smoothstep)
  if (openT === 1 && rain >= 2) { rainClose += dt; if (rainClose > 6) { openT = 0; rainClose = 0; toast('비가 들이쳐서 덧창을 닫았어요'); if (audio) creak(); } } else rainClose = 0;
  lifeStep(dt);
  for (let i = shakes.length - 1; i >= 0; i--) { shakes[i].t -= dt; if (shakes[i].t <= 0) shakes.splice(i, 1); }
  render(dt);
  if (audio) soundStep(dt);
  bgT -= dt; if (bgT < 0) { bgT = .5; bgx.drawImage(cv, 0, 0, 27, 48); }
}
/* ---------- 만지기 ---------- */
function pos(e) { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / b.width * W, (e.clientY - b.top) / b.height * H]; }
function touch(x, y) { if (!W) return; if (bf && Math.hypot(x - bf.x, y - bf.y) < 7) { bf.leave = true; bf.sit = null; return; }   // 나비 톡 → 날아감
  for (const B of birds) if (B.tap(x, y, birdEnv())) { birdChirp(); return; }   // 새를 톡 → 날아감
  const xi = clamp(x | 0, 0, W - 1), yi = clamp(y | 0, 0, H - 1), i = yi * W + xi, c = CL[i];
  if (bloomT0) for (const b of buds) if (Math.hypot(x - b.x, y - b.y) < 5) { toast('남은 시간 ' + bloomLeft() + ' · ' + buds.filter(q => q.open > .5).length + '송이 피었어요'); return; }
  if (c === C_SHUT && openV > .9 && openT === 1 && time >= 1) { lamp = !lamp; toast(lamp ? '불을 켰어요' : '불을 껐어요'); if (audio) click(); return; }
  const onLeaf = openV > .05 && (() => { const ee = openV * openV * (3 - 2 * openV), th = ee * Math.PI * .78, w = SEAM - SX0; for (const side of [-1, 1]) { const hx = side < 0 ? SX0 : SX1 + 1, f = hx - side * w * Math.cos(th); if (x >= Math.min(hx, f) - 1 && x <= Math.max(hx, f) + 1 && y >= SY0 - 4 && y <= SY1 + 4) return true; } return false; })();
  if (c === C_SHUT || onLeaf) { if (rain >= 2 && openT === 0) { toast('비가 와서 덧창이 금방 닫힐 거예요'); } openT = openT ? 0 : 1; if (audio) creak(); return; }
  if (c === C_FLOOR || c === C_BASE) { ripple(xi, Math.max(FLOOR + 1, yi), 1.4); if (audio) plop(1); return; }
  let near = false; for (let dy = -6; dy <= 6 && !near; dy += 2) for (let dx = -6; dx <= 6; dx += 2) { const xx = xi + dx, yy = yi + dy; if (xx >= 0 && xx < W && yy >= 0 && yy < H && LEAF[yy * W + xx] > 0) { near = true; break; } }
  if (near) { shakes.push({ x, y, t: 1 }); const n = wet > .2 ? 20 : 6;
    for (let k = 0, tries = 0; k < n && tries < 300; tries++) { const px = Math.round(x + (R() - .5) * 28), py = Math.round(y + (R() - .5) * 20); if (px < 0 || py < 0 || px >= W || py >= H || !LEAF[py * W + px]) continue;
      falls.push({ x: px, y: py, vx: (R() - .5) * 10, vy: 0, dl: .05 + R() * .5, land: FLOOR + 3 + R() * (H - FLOOR - 6) }); k++; }
    for (let k = 0; k < 8; k++) petal(x + (R() - .5) * 18, y + (R() - .5) * 10, true);
    if (audio) patter(n); } }
cv.addEventListener('pointerdown', e => { startAudio(false); const [x, y] = pos(e); touch(x, y); });

/* ---------- 조작판 ---------- */
function seg(id, get, set) { const el = document.getElementById(id), bs = [...el.querySelectorAll('button')];
  const upd = () => bs.forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === get()));
  bs.forEach(b => b.addEventListener('click', () => { set(+b.dataset.v); upd(); })); upd(); }
const hr = new Date().getHours(); time = hr >= 6 && hr < 16 ? 0 : hr >= 16 && hr < 19 ? 1 : 2;
Object.assign(tp, JSON.parse(JSON.stringify(TP[time])));
seg('segRain', () => rain, v => { rain = v; if (v === 0) toast('비 그침 · 해가 나오며 그림자가 다시 그려져요', 2400); });
seg('segTime', () => time, v => { time = v; lamp = true; });
const zen = document.getElementById('zen'); zen.addEventListener('click', () => { const on = !document.body.classList.contains('zen'); document.body.classList.toggle('zen', on); zen.setAttribute('aria-pressed', on); zen.textContent = on ? '조작 보이기' : '조작 숨기기'; });
let toastT; const toastEl = document.getElementById('toast');
function toast(s, ms) { toastEl.textContent = s; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), ms || 1800); }
bloomUI();

/* ---------- 소리: 회벽 · 덧창에 부딪는 빗소리, 창턱 똑, 덧창 삐걱, 맑은 날 새소리 · 바람 ----------
   크기 기준(시리즈 공통): 가장 센 소나기 = 0dB, 비 ≈ -12dB, 이슬비 ≈ -22dB. 약한 비일수록 부드럽게(lowpass 낮게) */
let audio = null, A = {};
const sndBtn = document.getElementById('snd');
sndBtn.addEventListener('click', () => { if (audio && audio.state === 'running') { audio.suspend(); sndBtn.setAttribute('aria-pressed', false); sndBtn.textContent = '♪ 소리 켜기'; } else startAudio(true); });
function noiseBuf(ac, sec) { const b = ac.createBuffer(1, ac.sampleRate * sec, ac.sampleRate), d = b.getChannelData(0); let l = 0; for (let i = 0; i < d.length; i++) { const w = R() * 2 - 1; l = (l + .02 * w) / 1.02; d[i] = w * .5 + l * 3; } return b; }
function impulse(ac, sec, decay) { const n = ac.sampleRate * sec, b = ac.createBuffer(2, n, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (R() * 2 - 1) * Math.pow(1 - i / n, decay); } return b; }
function loopSrc(buf) { const s = audio.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; }
const RAIN_DB = [-80, -22, -12, 0], RAIN_LP = [700, 2300, 5000, 8000];
function startAudio(force) {
  if (!force && !audio) return;
  if (!audio) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; audio = new AC();
    const nb = noiseBuf(audio, 4), out = audio.createGain(); out.gain.value = .9; out.connect(audio.destination); A.out = out;
    const rev = audio.createConvolver(); rev.buffer = impulse(audio, 1.2, 3.2); const rg = audio.createGain(); rg.gain.value = .3; rev.connect(rg); rg.connect(out); A.rev = rev;   // 좁은 골목 울림(짧게)
    const mk = (type, f, q, g, dest) => { const s = loopSrc(nb), fl = audio.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const gn = audio.createGain(); gn.gain.value = g; s.connect(fl); fl.connect(gn); gn.connect(dest || out); return { fl, gn }; };
    A.rain = mk('lowpass', 5000, .4, 0); A.wall = mk('bandpass', 1500, .7, 0, rev); A.hiss = mk('highpass', 6000, .3, 0); A.wind = mk('bandpass', 420, .8, 0); }
  audio.resume(); sndBtn.setAttribute('aria-pressed', true); sndBtn.textContent = '♪ 소리 끄기';
}
function soundStep(dt) { const now = audio.currentTime, g = Math.pow(10, RAIN_DB[rain] / 20);
  A.rain.gn.gain.setTargetAtTime(.16 * g, now, .7); A.rain.fl.frequency.setTargetAtTime(RAIN_LP[rain], now, .7);
  A.wall.gn.gain.setTargetAtTime(.06 * g, now, .7); A.hiss.gn.gain.setTargetAtTime(.02 * g * (rain === 3 ? 1 : .45), now, .7);
  A.wind.gn.gain.setTargetAtTime(.012 + gust * .05, now, .9); A.wind.fl.frequency.setTargetAtTime(380 + gust * 260, now, .9);   // 골목 바람: 바닥에 깔림
  if (audio.state !== 'running') return;
  if (R() < dt * [0, 1.5, 4, 8][rain]) tap([0, .25, .5, .8][rain] * Math.pow(10, RAIN_DB[rain] / 40));   // 덧창 · 창턱에 톡톡
  if (rain === 0 && time === 0 && sun > .6 && R() < dt * .22) chirp(); }
function tone(f, at, dur, g, type = 'sine', f2, toRev = .4) { const o = audio.createOscillator(), gn = audio.createGain(); o.type = type; o.frequency.setValueAtTime(f, at); if (f2) o.frequency.exponentialRampToValueAtTime(f2, at + dur);
  gn.gain.setValueAtTime(0, at); gn.gain.linearRampToValueAtTime(g, at + .006); gn.gain.exponentialRampToValueAtTime(.0001, at + dur); o.connect(gn); gn.connect(A.out);
  const sg = audio.createGain(); sg.gain.value = toRev; gn.connect(sg); sg.connect(A.rev); o.start(at); o.stop(at + dur + .05); }
function tap(s) { const f = 1600 + R() * 1200; tone(f, audio.currentTime + .01, .04, .012 * s, 'sine', f * .7, .25); }   // 11/11 우근 '물방울 소리 커서 거슬림' → 작고 둥글게
function tick2() { if (audio.state !== 'running') return; const f = 900 + R() * 500; tone(f, audio.currentTime + .25, .08, .012, 'sine', f * 1.4, .55); }   // 창턱 똑 (떨어져 닿는 소리)
function plop(s) { if (audio.state !== 'running') return; const f = 420 + R() * 300; tone(f, audio.currentTime + .01, .11, .018 * s, 'sine', f * 1.5, .5); }
function patter(n) { if (audio.state !== 'running') return; const m = n > 10 ? 3 : 2; let at = 180; for (let k = 0; k < m; k++) { setTimeout(() => plop(.35 + R() * .3), at); at += 260 + R() * 420; } }   // 또르르 연타 대신 두세 방울만 띄엄띄엄
function chirp() { const at = audio.currentTime + .02, n = 2 + (R() * 3 | 0), f = 2800 + R() * 1400; for (let k = 0; k < n; k++) tone(f * (1 + k * .04), at + k * .11, .08, .018, 'sine', f * 1.35, .25); }
function creak() { if (audio.state !== 'running') return; const at = audio.currentTime + .01, o = audio.createOscillator(), fl = audio.createBiquadFilter(), gn = audio.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(110, at); for (let k = 1; k < 10; k++) o.frequency.setValueAtTime(95 + R() * 40, at + k * .06);
  fl.type = 'bandpass'; fl.frequency.value = 1300; fl.Q.value = 4; gn.gain.setValueAtTime(0, at); gn.gain.linearRampToValueAtTime(.05, at + .05); gn.gain.linearRampToValueAtTime(.0001, at + .6);
  o.connect(fl); fl.connect(gn); gn.connect(A.out); o.start(at); o.stop(at + .65); }
function click() { if (audio.state !== 'running') return; tone(1400, audio.currentTime + .01, .03, .04, 'square', 900, .1); }
function chime() { if (audio.state !== 'running') return; const at = audio.currentTime + .05; [784, 988, 1175, 1568].forEach((f, k) => tone(f, at + k * .18, 1.6, .045, 'sine', null, .6)); }
setup();
})();
